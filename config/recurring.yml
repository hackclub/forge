production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  reap_stuck_ai_checks:
    class: ReapStuckAiChecksJob
    queue: background
    schedule: every 5 minutes

  uptime_ping:
    class: UptimePingJob
    queue: uptime
    schedule: every minute

  reel_payouts:
    class: ReelPayoutJob
    queue: background
    schedule: every day at 3am

  airtable_sync_check:
    class: AirtableSyncCheckJob
    queue: background
    schedule: every 15 minutes

  sync_all_journals:
    class: SyncAllJournalsJob
    queue: background
    schedule: every 30 minutes

  streak_reconciliation:
    class: StreakReconciliationJob
    queue: background
    schedule: every hour

  compute_guild_multipliers:
    class: ComputeGuildMultipliersJob
    queue: background
    schedule: every Sunday at 0:00

  contributors_weekly_ping:
    class: SlackContributorsPingJob
    queue: background
    schedule: "0 18 * * 3 America/New_York"

  contributors_channel_invites:
    class: SlackContributorsInviteJob
    queue: background
    schedule: every day at 9am

  streak_break_check:
    class: StreakBreakCheckJob
    queue: background
    schedule: every hour at minute 20

  streak_leaderboard:
    class: SlackStreakLeaderboardJob
    queue: background
    args: [ true ]
    schedule: "0 10 * * * America/New_York"
